name: Update market opportunity dashboard

on:
  workflow_dispatch: {}
  schedule:
    # Hourly from 05:00-22:00 UTC. Covers Saudi and US trading windows.
    - cron: "7 5-22 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build dashboard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python dashboard.py
      - name: Commit refreshed dashboard
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/index.html public/data.json
          git diff --staged --quiet || git commit -m "Refresh market dashboard"
          git push
